[package]
name = "silicon-entropy"
version = "0.1.0"
edition = "2021"
description = "Dual-core RP2040 Hardware TRNG over USB with on-chip NIST SP 800-90B health tests and SHA-256 whitening"
license = "MIT"

[dependencies]
cortex-m = "0.7"
cortex-m-rt = "0.7"
embedded-hal = "1.0"
panic-halt = "1.0"
rp2040-boot2 = "0.3"
rp2040-hal = { version = "0.10", features = ["rt", "critical-section-impl"] }
usb-device = "0.3"
usbd-serial = "0.2"
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = 3
lto = true
debug = 2
codegen-units = 1
